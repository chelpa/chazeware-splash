<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chazeware - Exploración de Identidad Interactiva</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            --bg-color: #0b1121;
            --card-bg: #151e32;
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 70%);
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
        }

        .logo-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .logo-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(0,242,254,0.1), transparent 50%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .logo-card:hover::before {
            opacity: 1;
        }

        .canvas-area {
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            transform: translateZ(40px);
        }

        h2 {
            font-weight: 900;
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            letter-spacing: -1px;
            transform: translateZ(20px);
        }

        p {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            transform: translateZ(20px);
        }

        .gradient-text {
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* CONCEPT 1: MOVING CW */
        .svg-cw { width: 100%; height: 100%; overflow: visible; }
        .cw-path {
            fill: none; stroke: url(#cw-grad); stroke-width: 18;
            stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 1000; stroke-dashoffset: 0;
            transition: stroke-dasharray 0.4s ease, filter 0.4s ease;
        }
        .cw-speed-line {
            fill: none; stroke: var(--accent-cyan); stroke-width: 4;
            stroke-linecap: round; opacity: 0; transition: opacity 0.3s, transform 0.3s;
        }
        .logo-card:hover .cw-path {
            stroke-dasharray: 60 30; animation: dash-flow 1.2s linear infinite;
            filter: drop-shadow(0 0 12px rgba(0,242,254,0.6));
        }
        .logo-card:hover .cw-speed-line { opacity: 0.7; }
        .logo-card:hover .speed-1 { animation: speed-shoot 0.8s linear infinite; }
        .logo-card:hover .speed-2 { animation: speed-shoot 1.1s linear infinite 0.2s; }
        .logo-card:hover .speed-3 { animation: speed-shoot 0.9s linear infinite 0.4s; }
        @keyframes dash-flow { to { stroke-dashoffset: -180; } }
        @keyframes speed-shoot {
            0% { transform: translateX(-40px); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateX(60px); opacity: 0; }
        }

        /* CONCEPT 2: 'Ch' GATE */
        .svg-ch { width: 100%; height: 100%; overflow: visible; }
        .ch-gate-ring {
            fill: none; stroke: url(#ch-grad-accent); stroke-width: 14;
            stroke-linecap: round; transform-origin: 100px 100px;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), stroke-width 0.4s;
        }
        .ch-h-center {
            fill: var(--text-main);
            transition: fill 0.4s, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.4s;
            transform-origin: 100px 100px;
        }
        .ch-data-node {
            fill: var(--accent-cyan); opacity: 0; transform-origin: 100px 100px;
        }
        .logo-card:hover .ch-gate-ring {
            transform: rotate(90deg) scale(1.05); stroke-width: 10;
            filter: drop-shadow(0 0 15px rgba(0,242,254,0.4));
        }
        .logo-card:hover .ch-h-center {
            fill: url(#ch-grad-accent); transform: scale(1.15);
            filter: drop-shadow(0 0 20px rgba(0,242,254,0.8));
        }
        .logo-card:hover .ch-data-node { animation: node-pulse 1.5s ease-out infinite; }
        @keyframes node-pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGO 1: MOVING CW -->
        <div class="logo-card" id="card-cw">
            <div class="canvas-area">
                <svg viewBox="0 0 300 150" class="svg-cw">
                    <defs>
                        <linearGradient id="cw-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#00f2fe" />
                            <stop offset="100%" stop-color="#4facfe" />
                        </linearGradient>
                    </defs>
                    <path class="cw-speed-line speed-1" d="M 20 50 L 70 50" />
                    <path class="cw-speed-line speed-2" d="M 10 80 L 50 80" />
                    <path class="cw-speed-line speed-3" d="M 30 110 L 80 110" />
                    <path class="cw-path" d="M 120 40 C 60 40, 50 75, 50 75 C 50 75, 60 110, 120 110 L 155 40 L 190 110 L 225 40 L 260 110 L 280 110" />
                </svg>
            </div>
            <h2>chazeware</h2>
            <p>Dinámico / Motion <span class="gradient-text">CW</span></p>
        </div>

        <!-- LOGO 2: 'Ch' GATE -->
        <div class="logo-card" id="card-ch">
            <div class="canvas-area">
                <svg viewBox="0 0 200 200" class="svg-ch">
                    <defs>
                        <linearGradient id="ch-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00f2fe" />
                            <stop offset="100%" stop-color="#4facfe" />
                        </linearGradient>
                    </defs>
                    <circle class="ch-data-node" cx="100" cy="100" r="15" />
                    <g class="ch-gate-ring">
                        <path d="M 100 20 A 80 80 0 0 0 20 100" />
                        <path d="M 20 100 A 80 80 0 0 0 100 180" />
                        <path d="M 100 180 A 80 80 0 0 0 170 140" />
                        <path d="M 170 60 A 80 80 0 0 0 100 20" />
                        <line x1="20" y1="100" x2="35" y2="100" stroke-width="6" />
                        <line x1="100" y1="20" x2="100" y2="35" stroke-width="6" />
                        <line x1="100" y1="180" x2="100" y2="165" stroke-width="6" />
                    </g>
                    <path class="ch-h-center" d="M 75 65 L 95 65 L 95 90 L 105 90 L 105 65 L 125 65 L 125 135 L 105 135 L 105 110 L 95 110 L 95 135 L 75 135 Z" />
                </svg>
            </div>
            <h2><span class="gradient-text">ch</span>z</h2>
            <p>Estructura / The Gate <span class="gradient-text">H</span></p>
        </div>
    </div>
    <script>
        document.querySelectorAll('.logo-card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left; 
                const y = e.clientY - rect.top;  
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -12;
                const rotateY = ((x - centerX) / centerX) * 12;
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)';
            });
        });
    </script>
</body>
</html>
